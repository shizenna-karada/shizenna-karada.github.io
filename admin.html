<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | 表参道 自然なからだ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1510;
    --ash: #6b6258;
    --paper: #f8f4ef;
    --cream: #ede8e0;
    --gold: #b8975a;
    --gold-light: #d4b87a;
    --border: rgba(184,151,90,0.25);
    --red: #c0756a;
    --green: #7a8c72;
    --white: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font-family: 'Noto Serif JP', serif; min-height: 100vh; }

  /* ── ログイン画面 ── */
  #login-screen {
    position: fixed; inset: 0;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 24px;
  }
  .login-box {
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.6s ease both;
  }
  .login-logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .login-logo .en {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--gold);
    display: block;
    margin-bottom: 8px;
  }
  .login-logo .ja {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: white;
    display: block;
    margin-bottom: 4px;
  }
  .login-logo .sub {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.4);
  }
  .login-field {
    margin-bottom: 16px;
  }
  .login-field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
  }
  .login-field input {
    width: 100%;
    padding: 14px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(184,151,90,0.3);
    color: white;
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-field input:focus { border-color: var(--gold); }
  .login-field input::placeholder { color: rgba(255,255,255,0.2); }
  .login-btn {
    width: 100%;
    padding: 16px;
    background: var(--gold);
    border: none;
    color: white;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    letter-spacing: 0.25em;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .login-btn:hover { background: var(--gold-light); }
  .login-error {
    color: #e8a09a;
    font-size: 11px;
    text-align: center;
    margin-top: 12px;
    letter-spacing: 0.05em;
    display: none;
  }

  /* ── メインレイアウト ── */
  #app { display: none; }

  .topbar {
    background: var(--ink);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--gold);
  }
  .topbar-nav {
    display: flex;
    gap: 4px;
  }
  .nav-btn {
    padding: 8px 16px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.5);
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .nav-btn:hover { color: white; }
  .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .logout-btn {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.4);
    font-family: 'Noto Serif JP', serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── タブパネル ── */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeUp 0.4s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── セクションヘッダー ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.15em;
  }
  .section-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    display: block;
    margin-bottom: 4px;
  }

  /* ── カード ── */
  .card {
    background: white;
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 12px;
    position: relative;
    transition: all 0.2s;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover::before { opacity: 1; }

  /* ── テーブル ── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th {
    text-align: left;
    padding: 10px 12px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.15em;
    color: var(--ash);
    border-bottom: 1px solid var(--border);
    background: #faf8f4;
  }
  .data-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(184,151,90,0.1);
    vertical-align: middle;
  }
  .data-table tr:hover td { background: #faf8f4; }

  /* ── バッジ ── */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    letter-spacing: 0.05em;
    border-radius: 0;
  }
  .badge-confirmed { background: #eaf0e8; color: var(--green); border: 1px solid rgba(122,140,114,0.3); }
  .badge-cancelled { background: #fdf0ee; color: var(--red); border: 1px solid rgba(192,117,106,0.3); }
  .badge-manual { background: #f0edf8; color: #7a6aaa; border: 1px solid rgba(122,106,170,0.3); }
  .badge-shinshin { background: #fdf8ee; color: var(--gold); border: 1px solid var(--border); }
  .badge-saishin { background: #f4f4f4; color: var(--ash); border: 1px solid rgba(107,98,88,0.2); }

  /* ── ボタン ── */
  .btn {
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: white;
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ash);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--gold); color: var(--ink); }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--gold); border-color: var(--gold); color: white; }
  .btn-danger { border-color: rgba(192,117,106,0.3); color: var(--red); }
  .btn-danger:hover { background: #fdf0ee; border-color: var(--red); }
  .btn-sm { padding: 5px 12px; font-size: 10px; }

  /* ── 検索・フィルター ── */
  .search-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    background: white;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--gold); }

  /* ── 統計カード ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: white;
    border: 1px solid var(--border);
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
  }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
    color: var(--gold);
    display: block;
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ash);
  }

  /* ── グラフ ── */
  .chart-wrap {
    background: white;
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 24px;
  }
  .chart-title {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ash);
    margin-bottom: 20px;
  }
  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar-label {
    font-size: 11px;
    color: var(--ash);
    width: 80px;
    flex-shrink: 0;
    text-align: right;
  }
  .bar-track {
    flex: 1;
    background: var(--cream);
    height: 20px;
    position: relative;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.8s ease;
  }
  .bar-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--ink);
    width: 40px;
  }

  /* ── モーダル ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,21,16,0.7);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper);
    max-width: 760px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: fadeUp 0.3s ease;
  }
  .modal-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  .modal-header::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
  }
  .modal-title {
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.1em;
  }
  .modal-close {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    color: var(--ash);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover { background: var(--red); color: white; border-color: var(--red); }
  .modal-body { padding: 28px; }

  /* 予診票詳細 */
  .detail-section {
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .detail-row {
    display: flex;
    gap: 8px;
    font-size: 12px;
    padding: 4px 0;
  }
  .detail-key {
    color: var(--ash);
    min-width: 100px;
    flex-shrink: 0;
  }
  .detail-val { color: var(--ink); }

  /* FVSスコアバー */
  .fvs-score-wrap { margin-bottom: 16px; }
  .fvs-score-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .fvs-score-label {
    font-size: 11px;
    color: var(--ash);
    width: 60px;
  }
  .fvs-score-track {
    flex: 1;
    background: var(--cream);
    height: 12px;
    position: relative;
  }
  .fvs-score-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
  }
  .fvs-score-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--ink);
    width: 30px;
    text-align: right;
  }

  /* メモ欄 */
  .memo-area {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    background: white;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    color: var(--ink);
    min-height: 100px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  .memo-area:focus { border-color: var(--gold); }

  /* 印刷ボタン */
  .print-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'Noto Serif JP', serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .print-btn:hover { background: var(--gold); }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--ash);
    font-size: 13px;
    letter-spacing: 0.1em;
  }

  /* 日付グループ */
  .date-group { margin-bottom: 24px; }
  .date-group-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--ink);
    color: white;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .date-group-header:hover { background: #2a2118; }
  .date-group-header.today { background: var(--gold); }
  .date-group-header.past { background: #4a4540; }
  .date-group-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.1em;
  }
  .date-group-day {
    font-size: 11px;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }
  .date-group-count {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.1em;
    opacity: 0.8;
  }
  .date-group-arrow {
    font-size: 12px;
    transition: transform 0.2s;
    opacity: 0.6;
  }
  .date-group-header.collapsed .date-group-arrow { transform: rotate(-90deg); }
  .date-group-body { display: block; }
  .date-group-body.collapsed { display: none; }
  .date-group-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .date-group-body th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.15em;
    color: var(--ash);
    border-bottom: 1px solid var(--border);
    background: #faf8f4;
  }
  .date-group-body td {
    padding: 12px;
    border-bottom: 1px solid rgba(184,151,90,0.1);
    vertical-align: middle;
  }
  .date-group-body tr:hover td { background: #faf8f4; }

  .past-toggle {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: var(--ash);
    letter-spacing: 0.1em;
    cursor: pointer;
    border: 1px dashed var(--border);
    margin-bottom: 24px;
    transition: all 0.2s;
  }
  .past-toggle:hover { border-color: var(--gold); color: var(--ink); }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--ash);
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  /* 印刷時 */
  @media print {
    .topbar, .search-bar, .btn, .modal-close, .print-btn, .memo-area + button,
    .content, body > *:not(#modal-overlay) { display: none !important; }
    #modal-overlay {
      position: static !important;
      background: none !important;
      padding: 0 !important;
      display: block !important;
    }
    .modal {
      max-height: none !important;
      box-shadow: none !important;
      max-width: 100% !important;
    }
    .modal-header { padding: 12px 16px; }
    .modal-body { padding: 16px; }
  }

  @media (max-width: 640px) {
    .topbar-nav { display: none; }
    .data-table { font-size: 11px; }
    .data-table th, .data-table td { padding: 8px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ── ログイン画面 ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <span class="en">Omotesando Shizenna Karada</span>
      <span class="ja">表参道 自然なからだ</span>
      <span class="sub">管理画面</span>
    </div>
    <div class="login-field">
      <label>パスワード</label>
      <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">ログイン</button>
    <div class="login-error" id="login-error">パスワードが正しくありません</div>
  </div>
</div>

<!-- ── メインアプリ ── -->
<div id="app">
  <div class="topbar">
    <span class="topbar-brand">自然なからだ 管理画面</span>
    <div class="topbar-nav">
      <button class="nav-btn active" onclick="switchTab('tab-booking', this)">予約一覧</button>
      <button class="nav-btn" onclick="switchTab('tab-yosinhyo', this)">予診票</button>
      <button class="nav-btn" onclick="switchTab('tab-stats', this)">統計</button>
    </div>
    <button class="logout-btn" onclick="doLogout()">ログアウト</button>
  </div>

  <div class="content">

    <!-- ===== 予約一覧 ===== -->
    <div class="tab-panel active" id="tab-booking">
      <div class="section-header">
        <div>
          <span class="section-label">Reservations</span>
          <h2 class="section-title">予約一覧</h2>
        </div>
        <button class="btn btn-primary" onclick="loadBookings()">更新</button>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" id="booking-search" placeholder="名前・日付で検索..." oninput="filterBookings()">
        <select class="search-input" id="booking-filter" style="flex:0;min-width:120px" onchange="filterBookings()">
          <option value="">すべて</option>
          <option value="予約確定">予約確定</option>
          <option value="キャンセル">キャンセル</option>
          <option value="手動入力">手動入力</option>
        </select>
      </div>

      <div id="booking-loading" class="loading">読み込み中...</div>
      <div id="booking-list-wrap" style="display:none"></div>
      <div id="booking-empty" class="empty-state" style="display:none">予約データがありません</div>
    </div>

    <!-- ===== 予診票 ===== -->
    <div class="tab-panel" id="tab-yosinhyo">
      <div class="section-header">
        <div>
          <span class="section-label">Medical Records</span>
          <h2 class="section-title">予診票一覧</h2>
        </div>
        <button class="btn btn-primary" onclick="loadYosinhyo()">更新</button>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" id="yosinhyo-search" placeholder="名前で検索..." oninput="filterYosinhyo()">
      </div>

      <div id="yosinhyo-loading" class="loading">読み込み中...</div>
      <div id="yosinhyo-table-wrap" style="display:none">
        <table class="data-table">
          <thead>
            <tr>
              <th>受付日時</th>
              <th>患者番号</th>
              <th>お名前</th>
              <th>年齢・性別</th>
              <th>主訴（抜粋）</th>
              <th>FVS合計</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="yosinhyo-tbody"></tbody>
        </table>
      </div>
      <div id="yosinhyo-empty" class="empty-state" style="display:none">予診票データがありません</div>
    </div>

    <!-- ===== 統計 ===== -->
    <div class="tab-panel" id="tab-stats">
      <div class="section-header">
        <div>
          <span class="section-label">Statistics</span>

<script>
  // ===== 設定 =====
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxJH3Uqp0nqmrloarLFk9xuXKohRVXO9fQ1I0i4EPCYxPM45CqjoNGR8VgZKFH-6fPE/exec';
  const PASSWORD = 'shizenna2024'; // ← ここでパスワードを変更できます

  // ===== ログイン =====
  function doLogin() {
    const pw = document.getElementById('pw-input').value;
    if (pw === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      sessionStorage.setItem('admin_auth', '1');
      loadBookings();
      loadYosinhyo();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pw-input').value = '';
    }
  }

  function doLogout() {
    sessionStorage.removeItem('admin_auth');
    location.reload();
  }

  // セッション維持
  if (sessionStorage.getItem('admin_auth') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  // ===== タブ切替 =====
  function switchTab(id, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    if (id === 'tab-stats') loadStats();
  }

  // ===== データ =====
  let allBookings = [];
  let allYosinhyo = [];

  // 予約データ読み込み
  async function loadBookings() {
    document.getElementById('booking-loading').style.display = 'block';
    document.getElementById('booking-list-wrap').style.display = 'none';
    document.getElementById('booking-empty').style.display = 'none';
    try {
      const res = await fetch(GAS_URL + '?action=all');
      const data = await res.json();
      allBookings = (data.bookings || []).reverse();
      renderBookings(allBookings);
    } catch(e) {
      document.getElementById('booking-loading').textContent = 'データの取得に失敗しました';
    }
  }

  function renderBookings(rows) {
    document.getElementById('booking-loading').style.display = 'none';
    const wrap = document.getElementById('booking-list-wrap');
    if (!rows.length) {
      document.getElementById('booking-empty').style.display = 'block';
      wrap.style.display = 'none';
      return;
    }
    document.getElementById('booking-empty').style.display = 'none';
    wrap.style.display = 'block';

    const today = new Date();
    today.setHours(0,0,0,0);
    const todayStr = formatDateStr(today);

    // 日付ごとにグループ化
    const groups = {};
    rows.forEach(row => {
      const [id, datetime, name, kana, phone, email, menu, status, note, date, time, visit] = row;
      const key = date ? String(date).trim() : '';
      if (!groups[key]) groups[key] = [];
      groups[key].push(row);
    });

    // 日付でソート
    const sortedKeys = Object.keys(groups).sort((a, b) => {
      if (!a) return 1; if (!b) return -1;
      return a > b ? 1 : -1;
    });

    // 今日以降・過去に分類
    const futureKeys = sortedKeys.filter(k => k >= todayStr || !k);
    const pastKeys = sortedKeys.filter(k => k && k < todayStr).reverse();

    const days = ['日','月','火','水','木','金','土'];
    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    function formatKeyLabel(key) {
      if (!key) return '日付不明';
      const d = new Date(key);
      if (isNaN(d)) return key;
      return `${d.getFullYear()}年${months[d.getMonth()]}${d.getDate()}日（${days[d.getDay()]}）`;
    }

    function renderRow(row) {
      const id = row[0], datetime = row[1], name = row[2], kana = row[3];
      const phone = row[4], email = row[5], menu = row[6], status = row[7];
      const note = row[8], date = row[9], time = row[10], occupation = row[11], visit = row[12];
      // 時刻のフォーマット（Dateオブジェクトの場合は変換）
      let timeStr = '';
      if (time instanceof Date || (typeof time === 'object' && time !== null)) {
        const h = String(time.getHours ? time.getHours() : new Date(time).getHours()).padStart(2,'0');
        const m = String(time.getMinutes ? time.getMinutes() : new Date(time).getMinutes()).padStart(2,'0');
        timeStr = `${h}:${m}`;
      } else {
        timeStr = String(time || '').trim();
      }
      const badgeClass = status === 'キャンセル' ? 'badge-cancelled' : status === '手動入力' ? 'badge-manual' : 'badge-confirmed';
      const visitBadge = visit === '初診' ? '<span class="badge badge-shinshin">初診</span>' : visit === '再診' ? '<span class="badge badge-saishin">再診</span>' : '';
      return `<tr>
        <td style="white-space:nowrap;font-weight:500">${timeStr ? timeStr + '〜' : datetime || ''}</td>
        <td>${name || ''}<br><span style="font-size:10px;color:var(--ash)">${kana || ''}</span></td>
        <td style="font-size:12px">${(menu || '').split('（')[0]}<br><span style="font-size:10px;color:var(--ash)">${phone || ''}</span><br><span style="font-size:10px;color:var(--ash)">${email || ''}</span></td>
        <td>${visitBadge}</td>
        <td style="font-size:11px;color:var(--ash)">${occupation || ''}</td>
        <td><span class="badge ${badgeClass}">${status || ''}</span></td>
        <td>${status !== 'キャンセル' ? `<button class="btn btn-sm btn-danger" onclick="cancelBooking('${id}', this)">キャンセル</button>` : ''}</td>
      </tr>`;
    }

    function renderGroup(key, isToday, isPast) {
      const groupRows = groups[key].sort((a, b) => (a[10] || '') > (b[10] || '') ? 1 : -1);
      const confirmedCount = groupRows.filter(r => r[7] !== 'キャンセル').length;
      const headerClass = isToday ? 'today' : isPast ? 'past' : '';
      const todayLabel = isToday ? '　<span style="font-size:10px;background:white;color:var(--gold);padding:2px 8px">今日</span>' : '';
      return `
        <div class="date-group">
          <div class="date-group-header ${headerClass}" onclick="toggleGroup(this)">
            <span class="date-group-date">${formatKeyLabel(key)}</span>
            ${todayLabel}
            <span class="date-group-count">${confirmedCount}件</span>
            <span class="date-group-arrow">▼</span>
          </div>
          <div class="date-group-body">
            <table>
              <thead><tr><th>時間</th><th>お名前</th><th>メニュー・電話</th><th>初再診</th><th>職種・立場</th><th>状態</th><th>操作</th></tr></thead>
              <tbody>${groupRows.map(renderRow).join('')}</tbody>
            </table>
          </div>
        </div>`;
    }

    let html = '';

    // 今日以降
    if (futureKeys.length) {
      futureKeys.forEach(key => {
        html += renderGroup(key, key === todayStr, false);
      });
    }

    // 過去（折りたたみ）
    if (pastKeys.length) {
      const pastId = 'past-section-' + Date.now();
      html += `<div class="past-toggle" onclick="togglePast('${pastId}')">▼ 過去の予約（${pastKeys.length}日分）を表示</div>`;
      html += `<div id="${pastId}" style="display:none">`;
      pastKeys.forEach(key => {
        html += renderGroup(key, false, true);
      });
      html += `</div>`;
    }

    wrap.innerHTML = html;
  }

  function toggleGroup(header) {
    header.classList.toggle('collapsed');
    header.nextElementSibling.classList.toggle('collapsed');
  }

  function togglePast(id) {
    const el = document.getElementById(id);
    const toggle = el.previousElementSibling;
    if (el.style.display === 'none') {
      el.style.display = 'block';
      toggle.textContent = '▲ 過去の予約を非表示';
    } else {
      el.style.display = 'none';
      toggle.textContent = '▼ 過去の予約を表示';
    }
  }

  function formatDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function filterBookings() {
    const q = document.getElementById('booking-search').value.toLowerCase();
    const f = document.getElementById('booking-filter').value;
    const filtered = allBookings.filter(row => {
      const name = (row[2] || '').toLowerCase();
      const kana = (row[3] || '').toLowerCase();
      const datetime = (row[1] || '').toLowerCase();
      const status = row[7] || '';
      const matchQ = !q || name.includes(q) || kana.includes(q) || datetime.includes(q);
      const matchF = !f || status === f;
      return matchQ && matchF;
    });
    renderBookings(filtered);
  }

  async function cancelBooking(id, btn) {
    if (!confirm('この予約をキャンセルしますか？')) return;
    btn.disabled = true;
    btn.textContent = '処理中...';
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateStatus', id: id, status: 'キャンセル' })
      });
      await loadBookings();
    } catch(e) {
      alert('エラーが発生しました');
      btn.disabled = false;
      btn.textContent = 'キャンセル';
    }
  }

  // 予診票データ読み込み
  async function loadYosinhyo() {
    document.getElementById('yosinhyo-loading').style.display = 'block';
    document.getElementById('yosinhyo-table-wrap') && (document.getElementById('yosinhyo-table-wrap').style.display = 'none');
    document.getElementById('yosinhyo-empty').style.display = 'none';
    try {
      const res = await fetch(GAS_URL + '?action=getYosinhyo');
      const data = await res.json();
      const rows = data.yosinhyo || [];
      // ヘッダー行がある場合は除く（最初の行が文字列配列かチェック）
      const dataRows = (rows.length > 0 && typeof rows[0][0] === 'string' && rows[0][0] === '受付日時')
        ? rows.slice(1) : rows;
      allYosinhyo = dataRows.reverse();
      renderYosinhyo(allYosinhyo);
    } catch(e) {
      document.getElementById('yosinhyo-loading').textContent = 'データの取得に失敗しました';
    }
  }

  function renderYosinhyo(rows) {
    document.getElementById('yosinhyo-loading').style.display = 'none';
    const tbody = document.getElementById('yosinhyo-tbody');
    if (!rows.length) {
      document.getElementById('yosinhyo-empty').style.display = 'block';
      return;
    }
    document.getElementById('yosinhyo-table-wrap').style.display = 'block';
    tbody.innerHTML = rows.map((row, i) => {
      const chief = (row[21] || '').substring(0, 30) + ((row[21] || '').length > 30 ? '...' : '');
      const fvsTotal = row[63] || '—';
      return `<tr>
        <td style="font-size:11px;white-space:nowrap">${typeof row[0] === 'object' && row[0] !== null ? new Date(row[0]).toLocaleString('ja-JP') : (row[0] || '')}</td>
        <td style="font-size:11px">${row[1] || '—'}</td>
        <td>${row[2] || ''}<br><span style="font-size:10px;color:var(--ash)">${row[3] || ''}</span></td>
        <td style="font-size:12px">${row[4] || ''}歳・${row[5] || ''}</td>
        <td style="font-size:11px;color:var(--ash)">${chief}</td>
        <td style="text-align:center">
          <span style="font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--gold)">${fvsTotal}</span>
          <span style="font-size:9px;color:var(--ash)">点</span>
        </td>
        <td><button class="btn btn-sm" onclick="showYosinhyoDetail(${i})">詳細</button></td>
      </tr>`;
    }).join('');
  }

  function filterYosinhyo() {
    const q = document.getElementById('yosinhyo-search').value.toLowerCase();
    const filtered = allYosinhyo.filter(row => {
      const name = (row[2] || '').toLowerCase();
      const kana = (row[3] || '').toLowerCase();
      return !q || name.includes(q) || kana.includes(q);
    });
    renderYosinhyo(filtered);
  }

                { q: '背中が痛む', val: row[66] },
              ]},
              { label: '心（精神・こころ）', score: row[59], items: [
                { q: '心配事が多い', val: row[67] },
                { q: 'よく悩む', val: row[68] },
                { q: '何事も楽しめない', val: row[69] },
              ]},
              { label: '脾（疲労・睡眠）', score: row[60], items: [
                { q: '疲れがとれない', val: row[70] },
                { q: '疲れて横になる', val: row[71] },
                { q: '体が重い', val: row[72] },
              ]},
              { label: '肺（自律神経）', score: row[61], items: [
                { q: '腹が鳴る', val: row[73] },
                { q: '腹が空いて仕方ない', val: row[74] },
                { q: '鼻水が出る', val: row[75] },
              ]},
              { label: '腎（脳機能）', score: row[62], items: [
                { q: 'ぼんやりする', val: row[76] },
                { q: '元気がない', val: row[77] },
                { q: '記憶力が低下する', val: row[78] },
              ]},
            ];
            return groups.map(g => `
              <div style="margin-bottom:20px">
                <div class="fvs-score-row">
                  <span class="fvs-score-label">${g.label}</span>
                  <div class="fvs-score-track">
                    <div class="fvs-score-fill" style="width:${Math.min(100, ((g.score||0)/8)*100)}%"></div>
                  </div>
                  <span class="fvs-score-num">${g.score || 0}</span>
                </div>
                <div style="padding-left:8px;margin-top:8px">
                  ${g.items.map(item => {
                    const v = parseInt(item.val) || 0;
                    const color = FVS_COLORS[v];
                    const pct = (v / 4) * 100;
                    const label = FVS_LABELS[v] || '—';
                    return `
                    <div style="margin-bottom:8px">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                        <span style="font-size:11px;color:var(--ash);letter-spacing:0.03em">${item.q}</span>
                        <span style="font-size:10px;color:${color};font-weight:500;white-space:nowrap;margin-left:12px">${label}</span>
                      </div>
                      <div style="position:relative;height:6px;background:#ede8e0;border-radius:3px">
                        <div style="position:absolute;top:0;left:0;height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width 0.3s"></div>
                        ${[0,1,2,3,4].map(i => `
                          <div style="position:absolute;top:50%;left:${i*25}%;transform:translate(-50%,-50%);width:2px;height:10px;background:white;border-radius:1px"></div>
                        `).join('')}
                        <div style="position:absolute;top:50%;left:${pct}%;transform:translate(-50%,-50%);width:12px;height:12px;background:${color};border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.2)"></div>
                      </div>
                      <div style="display:flex;justify-content:space-between;margin-top:2px">
                        <span style="font-size:9px;color:#aaa">全然ない</span>
                        <span style="font-size:9px;color:#aaa">いつもある</span>
                      </div>
                    </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('');
          })()}
          <div style="text-align:right;margin-top:8px;font-size:12px;color:var(--ash)">
            合計：<span style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold)">${row[63] || 0}</span>点 / 40点
          </div>
        </div>

        ${(() => {
          // 主証・副証の判定
          const viscera = [
            { name: '肝', score: parseInt(row[58]) || 0 },
            { name: '心', score: parseInt(row[59]) || 0 },
            { name: '脾', score: parseInt(row[60]) || 0 },
            { name: '肺', score: parseInt(row[61]) || 0 },
            { name: '腎', score: parseInt(row[62]) || 0 },
          ];
          const sorted = [...viscera].sort((a, b) => b.score - a.score);
          const maxScore = sorted[0].score;
          const sho = sorted.filter(v => v.score === maxScore);
          const fusho = sorted.filter(v => v.score !== maxScore && maxScore - v.score <= 3);

          // 合計スコア評価
          const total = parseInt(row[63]) || 0;
          let evaluation, evalColor, evalDesc;
          if (total <= 8) {
            evaluation = '良好'; evalColor = '#7a8c72';
            evalDesc = '全体的に不定愁訴は少なく、良好な状態です。';
          } else if (total <= 16) {
            evaluation = '軽度の不調あり'; evalColor = '#b8975a';
            evalDesc = '一部に不定愁訴がみられます。生活習慣の見直しを検討してください。';
          } else if (total <= 24) {
            evaluation = '中程度の不調あり'; evalColor = '#c09a5a';
            evalDesc = '複数の臓に不定愁訴が蓄積しています。施術の優先度を検討してください。';
          } else if (total <= 32) {
            evaluation = '不調が強い・要注意'; evalColor = '#c07a5a';
            evalDesc = '全身的な不調が強い状態です。回復に時間がかかる可能性があります。生活習慣全般の見直しを促してください。';
          } else {
            evaluation = '全身的な不調が顕著'; evalColor = '#c0756a';
            evalDesc = '不定愁訴が非常に多く蓄積しています。施術への反応が出にくい場合があります。十分な注意と丁寧な経過観察が必要です。';
          }

          return `
          <div style="background:#faf8f4;border:1px solid var(--border);padding:16px 20px;margin-top:16px;position:relative">
            <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold))"></div>
            <div style="font-size:10px;letter-spacing:0.25em;color:var(--gold);margin-bottom:12px">— 証の評価</div>
            <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px">
              <div>
                <div style="font-size:9px;letter-spacing:0.15em;color:var(--ash);margin-bottom:4px">主証</div>
                <div style="font-size:16px;font-weight:500;color:var(--ink);letter-spacing:0.1em">
                  ${sho.map(v => `${v.name}（${v.score}点）`).join('・')}
                </div>
              </div>
              ${fusho.length > 0 ? `
              <div>
                <div style="font-size:9px;letter-spacing:0.15em;color:var(--ash);margin-bottom:4px">副証</div>
                <div style="font-size:14px;color:var(--ash);letter-spacing:0.1em">
                  ${fusho.map(v => `${v.name}（${v.score}点）`).join('・')}
                </div>
              </div>` : ''}
            </div>
            <div style="font-size:10px;color:var(--ash);letter-spacing:0.05em;padding-top:8px;border-top:1px solid var(--border)">
              ※主証との差が3点以内の臓を副証として表示しています
            </div>
          </div>

          <div style="background:#faf8f4;border:1px solid var(--border);border-left:3px solid ${evalColor};padding:16px 20px;margin-top:12px">
            <div style="font-size:9px;letter-spacing:0.15em;color:var(--ash);margin-bottom:6px">合計スコア評価（${total}点 / 40点）</div>
            <div style="font-size:15px;font-weight:500;color:${evalColor};letter-spacing:0.08em;margin-bottom:6px">${evaluation}</div>
            <div style="font-size:11px;color:var(--ash);line-height:1.8;letter-spacing:0.05em">${evalDesc}</div>
          </div>
          `;
        })()}
      </div>

      <div class="detail-section">
        <div class="detail-section-title">院長メモ</div>
        <textarea class="memo-area" id="memo-input" placeholder="聴取内容・所見・メモなどをご記入ください">${row[row.length-1] || ''}</textarea>
        <div style="margin-top:8px;text-align:right">
          <button class="btn btn-primary" onclick="saveMemo(${i})">メモを保存</button>
        </div>
      </div>
    `;

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function printModal() {
    window.print();
  }

  // 院長メモ保存
  async function saveMemo(rowIndex) {
    const memo = document.getElementById('memo-input').value;
    const row = allYosinhyo[rowIndex];
    const timestamp = row[0];
    const name = row[2];
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'saveMemo', timestamp, name, memo })
      });
      alert('メモを保存しました');
    } catch(e) {
      alert('保存に失敗しました');
    }
  }

  // 患者番号保存
  async function savePatientNo(rowIndex) {
    const no = document.getElementById('patient-no-input').value;
    const row = allYosinhyo[rowIndex];
    const timestamp = row[0];
    const name = row[2];
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'savePatientNo', timestamp, name, patientNo: no })
      });
      const result = await res.json();
      if (result.status === 'ok') {
        allYosinhyo[rowIndex][1] = no;
        alert('患者番号を保存しました');
        renderYosinhyo(allYosinhyo);
      } else {
        alert('保存に失敗しました: ' + (result.message || '不明なエラー'));
      }
    } catch(e) {
      alert('保存に失敗しました');
    }
  }

  // ===== 統計 =====
  async function loadStats() {
    try {
      // 予約データ
      const r1 = await fetch(GAS_URL + '?action=all');
      const d1 = await r1.json();
      const bookings = d1.bookings || [];

      const confirmed = bookings.filter(r => r[7] !== 'キャンセル');
      const now = new Date();
      const thisMonth = confirmed.filter(r => {
        const d = new Date(r[1]);
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      });
      const shinshin = confirmed.filter(r => r[11] === '初診');

      document.getElementById('stat-total-booking').textContent = confirmed.length;
      document.getElementById('stat-this-month').textContent = thisMonth.length;
      document.getElementById('stat-shinshin').textContent = shinshin.length;

      // メニュー別
      const menuCount = {};
      confirmed.forEach(r => {
        const m = (r[6] || '').split('（')[0];
        menuCount[m] = (menuCount[m] || 0) + 1;
      });
      const maxMenu = Math.max(...Object.values(menuCount), 1);
      document.getElementById('chart-menu').innerHTML = Object.entries(menuCount).map(([k,v]) => `
        <div class="bar-row">
          <span class="bar-label">${k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/maxMenu)*100}%"></div></div>
          <span class="bar-val">${v}件</span>
        </div>
      `).join('');

      // 月別
      const monthCount = {};
      confirmed.forEach(r => {
        const d = new Date(r[1]);
        if (!isNaN(d)) {
          const key = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
          monthCount[key] = (monthCount[key] || 0) + 1;
        }
      });
      const sortedMonths = Object.keys(monthCount).sort();
      const maxMonth = Math.max(...Object.values(monthCount), 1);
      document.getElementById('chart-monthly').innerHTML = sortedMonths.map(k => `
        <div class="bar-row">
          <span class="bar-label">${k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(monthCount[k]/maxMonth)*100}%"></div></div>
          <span class="bar-val">${monthCount[k]}件</span>
        </div>
      `).join('');

      // 予診票統計
      const r2 = await fetch(GAS_URL + '?action=getYosinhyo');
      const d2 = await r2.json();
      const yRows = (d2.yosinhyo || []);
      document.getElementById('stat-yosinhyo').textContent = yRows.length;

      if (yRows.length > 0) {
        const fvsAvg = Math.round(yRows.reduce((sum, r) => sum + (parseInt(r[64]) || 0), 0) / yRows.length);
        document.getElementById('stat-fvs-avg').textContent = fvsAvg;

        const fvsLabels = ['肝', '心', '脾', '肺', '腎'];
        const fvsAvgs = [59,60,61,62,63].map((col, i) => ({
          label: fvsLabels[i],
          avg: Math.round(yRows.reduce((sum, r) => sum + (parseInt(r[col]) || 0), 0) / yRows.length * 10) / 10
        }));
        const maxFvs = Math.max(...fvsAvgs.map(f => f.avg), 1);
        document.getElementById('chart-fvs').innerHTML = fvsAvgs.map(f => `
          <div class="bar-row">
            <span class="bar-label">${f.label}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(f.avg/8)*100}%"></div></div>
            <span class="bar-val">${f.avg}点</span>
          </div>
        `).join('');
      }

    } catch(e) {
      console.error(e);
    }
  }

  // 初期読み込み
  if (sessionStorage.getItem('admin_auth') === '1') {
    loadBookings();
    loadYosinhyo();
  }
</script>
</body>
</html>
